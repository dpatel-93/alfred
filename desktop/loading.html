<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Alfred</title>
  <style>
    html, body { height: 100%; margin: 0; background: #07080d; color: #e6f7ff; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    main { text-align: center; max-width: 560px; padding: 24px; }
    h1 { font-weight: 500; letter-spacing: 0.3em; font-size: 18px; margin: 0 0 8px; }
    p { color: #8fa3bf; margin: 0; }
    .error { color: #ff6b81; }
    .dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <main>
    <h1>ALFRED</h1>
    <p id="msg" class="dots">Starting Alfred's engine</p>
  </main>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    if (error) {
      const msg = document.getElementById('msg');
      msg.className = 'error';
      msg.textContent = error;
    }
  </script>
</body>
</html>
